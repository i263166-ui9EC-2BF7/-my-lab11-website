
<!DOCTYPE html>
<html>
<head>
    <title>Cafe Gallery</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
            text-align: center;
        }

        header {
            background-color: DodgerBlue;
            color: white;
            padding: 20px;
        }

        nav {
            background-color: Tomato;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
        }

        h2 {
            color: DodgerBlue;
            margin-top: 25px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            padding: 25px;
        }

        .gallery-item {
            background-color: white;
            width: 250px;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 2px 8px gray;
        }

        .gallery-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .gallery-item p {
            color: Tomato;
            font-weight: bold;
        }

        footer {
            background-color: DodgerBlue;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to Our Cafe</h1>
        <p>Enjoy Delicious Food and Drinks</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>

    <h2>Our Food Gallery</h2>
    <p>Explore our delicious food and drinks!</p>

    <div class="gallery">

        <div class="gallery-item">
            <img src="images/imageone.jfif" alt="Cafe picture">
            <p>Our Cafe</p>
        </div>

        <div class="gallery-item">
            <img src="images/images (1).jfif" alt="Chai">
            <p>Fresh Chai</p>
        </div>

        <div class="gallery-item">
            <img src="images/images.jfif" alt="Biryani">
            <p>Delicious Biryani</p>
        </div>

        

    </div>

    <footer>
        <p>Thank you for visiting our Cafe!</p>
    </footer>

</body>
</html>
